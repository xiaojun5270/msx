name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare app version
        run: python3 scripts/prepare_app_version.py --run-number "$GITHUB_RUN_NUMBER"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Complete Android project files
        run: flutter create --empty --platforms=android --org com.musix --project-name musix .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: |
          flutter test
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Restore fixed release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64 repository secret. Refusing to use debug signing.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'musix-release.p12'
          path.write_bytes(base64.b64decode(encoded, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY

      - name: Build release APK with fixed signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name="$APP_BUILD_NAME"
          --build-number="$APP_BUILD_SEQUENCE"
          --dart-define="APP_DISPLAY_VERSION=$APP_DISPLAY_VERSION"

      - name: Verify release signing certificate
        id: verify-signing
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee "$RUNNER_TEMP/apk-certificate.txt"
          python3 scripts/verify_apk_certificate.py "$RUNNER_TEMP/apk-certificate.txt" android/signing-certificate.sha256

      - name: Upload signing diagnostics on failure
        if: failure() && steps.verify-signing.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: apk-signing-diagnostics
          path: ${{ runner.temp }}/apk-certificate.txt
          if-no-files-found: warn

      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/musix-release.p12"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musix-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MusicX ${{ env.APP_DISPLAY_VERSION }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
